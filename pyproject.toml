[project]
name = "bloom-v4-experimental"
version = "0.0.1"
description = "A CLI experiment in persistent, event-driven agents"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<17"]

[project.scripts]
bloom4 = "bloom4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom4"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "docs", "README.md", "AGENTS.md", "LICENSE", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
