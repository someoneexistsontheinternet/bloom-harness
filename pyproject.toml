[project]
name = "bloom-v41-experimental"
version = "0.1.0"
description = "Filesystem messages, persistent agents, and standalone tools"
readme = "README.md"
license = "MIT AND Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "tiktoken>=0.9,<1"]

[project.scripts]
bloom41 = "bloom41.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom41", "lib/bloom_safari"]

[tool.hatch.build.targets.wheel.force-include]
"tools/bundled" = "bloom41/bundled"
"profiles" = "bloom41/profiles"

[tool.hatch.build.targets.sdist]
only-include = ["src", "lib", "tools/bundled", "profiles", "tests", "scripts/check.py", "scripts/check_web.py", "scripts/profile_run.py", "scripts/profiler_view.html", "docs", ".github", "README.md", "AGENTS.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock", ".gitignore", ".python-version"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["lib/bloom_safari/web_assets", "logs", "workspace", "artifacts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
