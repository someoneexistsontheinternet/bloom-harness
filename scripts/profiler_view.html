<div id="bloom-v41-profiler">
  <div class="viz-row">
    <div>
      <label class="form-label" for="bloom-case">Question</label>
      <select class="form-select" id="bloom-case"></select>
    </div>
    <div id="bloom-totals" class="tabular-nums" aria-live="polite"></div>
  </div>
  <viz-waterfall id="bloom-waterfall" title="Operation timeline" description="Elapsed receipts; spans overlap. Actor groups include idle time. Direct time and critical path are estimates, not CPU time or proved dependencies."></viz-waterfall>
  <div class="viz-row">
    <span id="bloom-selection" class="text-small" aria-live="polite"></span>
    <button class="btn" type="button" id="bloom-investigate" hidden>Inspect selected operation</button>
  </div>
  <script type="application/json" id="bloom-trace-data">__TRACE_DATA__</script>
</div>
<style>
  #bloom-v41-profiler { display: grid; gap: calc(var(--font-size-base) * 1); }
  #bloom-v41-profiler > .viz-row:first-child { padding-inline-end: 90px; }
  #bloom-v41-profiler #bloom-selection { overflow-wrap: anywhere; }
  #bloom-v41-profiler viz-waterfall { min-width: 0; }
  #bloom-v41-profiler [hidden] { display: none; }
  /* The pinned widget reserves a row for every hidden span. Let collapsed
     actor groups size to their visible rows rather than thousands of blanks. */
  :host(#bloom-waterfall) .wf-table-wrap { min-height: 0; }
  @media (max-width: 640px) {
    :host(#bloom-waterfall) .wf-frame { overflow-x: auto; }
    :host(#bloom-waterfall) .wf-table { min-width: 480px; }
  }
</style>
<script type="module">
  import "https://persistent.oaistatic.com/plugins/visualize/widgets/1.0.59/waterfall.js";
  const root = document.getElementById("bloom-v41-profiler");
  const data = JSON.parse(root.querySelector("#bloom-trace-data").textContent);
  const chooser = root.querySelector("#bloom-case");
  const waterfall = root.querySelector("#bloom-waterfall");
  const summary = root.querySelector("#bloom-totals");
  const selection = root.querySelector("#bloom-selection");
  const inspect = root.querySelector("#bloom-investigate");
  const observations = {
    "Model decision": "Intent to terminal receipt; includes transport and local persistence.",
    "Luna / reader": "Intent to terminal receipt; includes transport and local persistence.",
    "Compaction": "Model request interval, not CPU time.",
    "Browser service": "Includes browser lease wait, discovery and captures; lease acquisition was not separately timed.",
    "Browser capture": "Manifest capture timestamps; zero duration means start was not recorded.",
    "Tool queue": "Prepared receipt to process launch, or cancellation before launch.",
    "Tool execution": "Launch intent to terminal receipt, including async waits and child tools.",
    "Result delivery": "Terminal result to notification; may include separate extraction.",
    "Admission": "Turn received to request start; includes local preparation and any request-admission delay in the recorded harness revision.",
    "Context preparation": "Context request to returned Terra message, including tool and queue waits.",
    "Inbox wait": "Delivered message to consuming turn start or filing.",
    "Operator pause": "Outside recorded CLI process lifetimes: setup or repair, not harness CPU.",
    "Runner": "Supervisor process start and exit.",
    "Service RPC": "Service intent to terminal receipt, or executor settlement if the service has no terminal receipt."
  };
  const elapsed = seconds => {
    if (seconds < 1) return `${Math.round(seconds * 1000)} ms`;
    if (seconds < 60) return `${seconds.toFixed(1)} s`;
    const rounded = Math.round(seconds);
    return `${Math.floor(rounded / 60)}m ${(rounded % 60).toString().padStart(2, "0")}s`;
  };
  for (const item of data.cases) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.id === "full-run" ? "Full run · all requests" : item.id.toUpperCase();
    chooser.append(option);
  }
  let selected = null;
  let applying = false;
  let activeCase = null;
  let saveTimer = null;
  let renderVersion = 0;
  function save() {
    if (applying || !window.openai?.setWidgetState) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      window.openai.setWidgetState({
        modelContent: {run: data.run, question: chooser.value, selectedOperation: selected?.spanId ?? null},
        privateContent: {run: data.run, question: chooser.value, view: waterfall.viewState}
      }).catch(() => {});
    }, 150);
  }
  async function show(id, view) {
    const version = ++renderVersion;
    applying = true;
    const item = data.cases.find(c => c.id === id) ?? data.cases[0];
    chooser.value = item.id;
    activeCase = item;
    selected = null;
    selection.textContent = "";
    inspect.hidden = true;
    const rows = data.rows.filter(r => r[4] <= item.end && r[4] + r[5] >= item.start);
    const included = new Set(rows.map(r => r[0]));
    const groups = new Map();
    for (const r of rows) {
      const actor = data.actors[r[3]];
      const start = Math.max(r[4], item.start) - item.start;
      const end = Math.min(r[4] + r[5], item.end) - item.start;
      const current = groups.get(actor) ?? {start, end, count:0};
      groups.set(actor, {start:Math.min(start,current.start), end:Math.max(end,current.end), count:current.count+1});
    }
    const spans = rows.map(r => {
      const start = Math.max(r[4], item.start);
      const end = Math.min(r[4] + r[5], item.end);
      const parent = r[8] === null ? null : data.rows[r[8]][0];
      const category = data.categories[r[2]];
      return {
        id: r[0], name: `${data.actors[r[3]]} · ${r[1]}`, service: category,
        startMs: Math.max(0, start - item.start), durationMs: Math.max(0, end - start),
        parentId: included.has(parent) ? parent : `display:${data.actors[r[3]]}`, status: r[9],
        attributes: {
          operation: r[0], actor: data.actors[r[3]], category,
          first_receipt: r[6] ?? "supervisor / manifest", last_receipt: r[7] ?? "supervisor / manifest",
          full_duration_seconds: r[5] / 1000,
          clipped_to_question: start !== r[4] || end !== r[4] + r[5],
          measurement: observations[category] ?? "Recorded receipt interval."
        }
      };
    });
    for (const [actor, group] of groups) {
      spans.push({id:`display:${actor}`, name:`${actor} · ${group.count} operations`,
        startMs:group.start, durationMs:group.end-group.start, service:"Actor group",
        attributes:{actor, operations:group.count, measurement:"Display grouping of recorded intervals; includes idle time. Not a physical operation or CPU measurement."}});
    }
    waterfall.durationMs = Math.max(1, item.end - item.start, ...spans.map(s=>s.startMs+s.durationMs));
    waterfall.spans = spans;
    summary.textContent = `${elapsed((item.end - item.start) / 1000)} elapsed · ${item.calls} model calls · longest tool queue ${elapsed(item.maxQueue)}`;
    if (item.downtime !== null && item.downtime >= 1) summary.textContent += ` · CLI offline ${elapsed(item.downtime)}`;
    await waterfall.ready;
    if (version !== renderVersion) return;
    waterfall.viewState = view ?? {selectedSpanId:null, collapsed:[...groups.keys()].map(a=>`display:${a}`), query:"", startMs:0, endMs:item.end-item.start, order:"trace", time:"total", details:false, critical:false};
    const restored = spans.find(s => s.id === waterfall.viewState?.selectedSpanId);
    if (restored) {
      selected = {spanId:restored.id, name:restored.name, startMs:restored.startMs, durationMs:restored.durationMs};
      selection.textContent = `${selected.spanId} · ${elapsed(selected.durationMs / 1000)}`;
      inspect.hidden = selected.spanId.startsWith("display:") || !window.openai?.sendFollowUpMessage;
    }
    applying = false;
  }
  waterfall.addEventListener("viz-state-change", event => {
    selected = event.detail.selection;
    selection.textContent = selected ? `${selected.spanId} · ${elapsed(selected.durationMs / 1000)}` : "";
    inspect.hidden = !selected || selected.spanId.startsWith("display:") || !window.openai?.sendFollowUpMessage;
    save();
  });
  chooser.addEventListener("change", async () => { await show(chooser.value); save(); });
  inspect.addEventListener("click", async () => {
    if (!selected || !window.openai?.sendFollowUpMessage) return;
    await window.openai.sendFollowUpMessage({
      title: "Inspect recorded operation",
      prompt: `Inspect operation ${selected.spanId} in Bloom v4.1 run ${data.run}, question ${activeCase.id}. Explain its inputs, outputs, dependencies and wait time from the receipts. Distinguish measured timing from inference. Do not restart the run.`
    });
  });
  function restore(state) {
    const saved = state?.privateContent;
    return saved?.run === data.run ? show(saved.question, saved.view) : show(data.cases[0].id);
  }
  window.addEventListener("openai:set_globals", event => {
    if (event.detail?.globals?.widgetState !== undefined) restore(event.detail.globals.widgetState);
  });
  await restore(window.openai?.widgetState);
</script>
